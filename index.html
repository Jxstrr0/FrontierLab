<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1828" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Vault Street: found a bank and grow it into a global financial empire."
    />
    <!-- PWA (docs/DEPLOYMENT.md, Stage 10). Every path is relative so the site
         works under the GitHub Pages sub-path /VaultStreet/. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault Street" />
    <title>Vault Street</title>
    <script>
      // ?debug: add the debug hook (src/debugEntry.ts) as a module script written
      // during parsing, so window.__vs is ready when the page's load event fires.
      if (/[?&]debug(=|&|$)/.test(location.search)) {
        var debugSrc = '%DEV%' === 'true' ? '/src/debugEntry.ts' : './assets/debug.js';
        document.write('<script type="module" src="' + debugSrc + '"><\/script>');
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
